name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt pytest
      - run: python -m pytest -q
      - name: Package clean source archive
        run: |
          mkdir -p dist
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED
          root = Path('.')
          excluded = {'.git', '.venv', 'venv', 'data', '__pycache__', '.pytest_cache', 'dist', 'build', 'node_modules', '.idea', '.vscode', 'htmlcov'}
          with ZipFile('dist/MosaicRoute-source.zip', 'w', ZIP_DEFLATED) as zf:
              for path in root.rglob('*'):
                  if any(part in excluded for part in path.parts):
                      continue
                  if path.is_file() and path.name not in {'.env', '.encryption_key', '.coverage', 'mosaicroute.log'} and not path.name.endswith(('.sqlite3', '.sqlite3-wal', '.sqlite3-shm', '.pyc', '.log')):
                      zf.write(path, Path('MosaicRoute') / path)
          PY
          sha256sum dist/MosaicRoute-source.zip > dist/SHA256SUMS.txt
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/MosaicRoute-source.zip
            dist/SHA256SUMS.txt
